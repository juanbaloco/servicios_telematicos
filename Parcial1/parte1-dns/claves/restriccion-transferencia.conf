// Fragmento del maestro que restringe la transferencia a la clave TSIG
// Archivo real: /etc/bind/named.conf.local

include "/etc/bind/keys/esclavo.key";

zone "empresa.local" {
    type master;
    file "/etc/bind/db.empresa.local";
    allow-transfer { key esclavo-key; };   // <-- solo con clave TSIG
    also-notify { 192.168.50.3; };
    ixfr-from-differences yes;
};

// Fragmento del esclavo que firma sus peticiones al maestro
// Archivo real: /etc/bind/named.conf.local del esclavo

server 192.168.50.2 {
    keys { esclavo-key; };
};
