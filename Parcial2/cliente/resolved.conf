#  Segundo Parcial 2230722 - DNS sobre TLS (DoT) con systemd-resolved
#  Copiar en /etc/systemd/resolved.conf y reiniciar:
#      sudo systemctl restart systemd-resolved
#  Ver: man resolved.conf

[Resolve]
# Resolvers publicos con DoT. Lo que va despues de '#' es el nombre (SNI)
# con el que se valida el certificado TLS del resolver.
DNS=1.1.1.1#cloudflare-dns.com 8.8.8.8#dns.google
FallbackDNS=1.0.0.1#cloudflare-dns.com 8.8.4.4#dns.google

# yes = DoT estricto: si no se puede establecer TLS en el puerto 853, la consulta falla
#       (nunca se degrada a DNS en texto plano por el puerto 53).
DNSOverTLS=yes

# Usar estos servidores para todos los dominios ("~." = ruta por defecto).
Domains=~.
