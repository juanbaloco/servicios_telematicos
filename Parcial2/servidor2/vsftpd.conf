# ===== Servicio basico =====
listen=YES
listen_ipv6=NO
anonymous_enable=NO
local_enable=YES
write_enable=YES
local_umask=022
dirmessage_enable=YES
use_localtime=YES
xferlog_enable=YES
connect_from_port_20=NO
chroot_local_user=YES
allow_writeable_chroot=YES
secure_chroot_dir=/var/run/vsftpd/empty
pam_service_name=vsftpd

# ===== FTPS: TLS explicito (AUTH TLS sobre el puerto 21) =====
ssl_enable=YES
rsa_cert_file=/etc/ssl/parcial/servidor.crt
rsa_private_key_file=/etc/ssl/parcial/servidor.key
allow_anon_ssl=NO
force_local_logins_ssl=YES
force_local_data_ssl=YES
ssl_sslv2=NO
ssl_sslv3=NO
ssl_tlsv1=YES
require_ssl_reuse=NO
ssl_ciphers=HIGH

# ===== Modo pasivo (coherente con las reglas de UFW en servidor1) =====
pasv_enable=YES
pasv_min_port=50000
pasv_max_port=50010
pasv_address=192.168.56.10
pasv_addr_resolve=NO
